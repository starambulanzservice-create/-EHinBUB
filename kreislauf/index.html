<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Teamarbeit zu Kreislauf-Notfällen in Bildungs- und Betreuungseinrichtungen für Kinder"
  >

  <title>Teamarbeit – Kreislauf-Notfälle</title>

  <style>
    :root {
      --star-red: #b00020;
      --text: #222;
      --muted: #5f6670;
      --page: #f2f4f7;
      --card: #ffffff;
      --case: #f7f7f7;
      --extra: #eef3f7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: var(--page);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .karte {
      max-width: 800px;
      margin: 30px auto;
      padding: 30px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .logo {
      margin-bottom: 22px;
      text-align: center;
    }

    .logo img {
      width: min(80%, 280px);
      height: auto;
    }

    h1 {
      margin: 0 0 10px;
      color: var(--star-red);
      text-align: center;
      line-height: 1.25;
    }

    .untertitel {
      margin: 0 0 28px;
      color: var(--muted);
      text-align: center;
    }

    .bereich {
      margin-top: 24px;
      padding: 22px;
      border-radius: 10px;
      line-height: 1.65;
    }

    .fall {
      background: var(--case);
    }

    .zusatz {
      background: var(--extra);
    }

    h2,
    h3 {
      margin: 0 0 12px;
    }

    #situation-1,
    #situation-2,
    #zusatzfrage,
    #anpassungsaufgabe {
      margin: 0;
    }

    #anpassungsaufgabe {
      margin-top: 18px;
    }

    .anpassungs-ueberschrift {
      display: inline-block;
      margin-bottom: 5px;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .karte {
        margin: 10px auto;
        padding: 20px;
      }

      h1 {
        font-size: 1.65rem;
      }

      .bereich {
        padding: 18px;
      }
    }
  </style>
</head>

<body>
  <main class="karte">

    <div class="logo">
      <img
        src="https://image.jimcdn.com/app/cms/image/transf/none/path/s4ae4e01473ee480d/image/i451db4a87a702f00/version/1762536248/image.jpg"
        alt="STAR Ambulanz Service"
      >
    </div>

    <h1>Teamarbeit „Kreislauf-Notfälle“</h1>

    <p class="untertitel">
      Erste Hilfe in Bildungs- und Betreuungseinrichtungen für Kinder
    </p>

    <section class="bereich fall" aria-labelledby="fall-titel-1">
      <h2 id="fall-titel-1">Fallsituation 1</h2>
      <p id="situation-1"></p>
    </section>

    <section class="bereich fall" aria-labelledby="fall-titel-2">
      <h2 id="fall-titel-2">Fallsituation 2</h2>
      <p id="situation-2"></p>
    </section>

    <section class="bereich zusatz" aria-labelledby="zusatz-titel">

      <h3 id="zusatz-titel">
        Zusatzaufgabe – Organisation der Ersten Hilfe
      </h3>

      <p id="zusatzfrage"></p>

      <p id="anpassungsaufgabe">
        <strong class="anpassungs-ueberschrift">
          Anpassung an eure Verhältnisse:
        </strong>
        <br>
        <span id="anpassungstext"></span>
      </p>

    </section>

  </main>

  <script>
    /*
      Es wird jeweils eine Fallsituation mit einem Erwachsenen
      und eine Fallsituation mit einem Kind ausgewählt.

      Die Reihenfolge der beiden Situationen wird zusätzlich
      automatisch gewechselt.
    */

    const erwachsenenfaelle = [
      {
        typ: "herzinfarkt",

        situation:
          "In der Grundschule findet am frühen Abend ein Elternabend statt. Nachdem die meisten Eltern gegangen sind, hilft ein 54-jähriger Lehrer gemeinsam mit zwei Kollegen beim Aufräumen des Klassenraums. Während er mehrere Stühle trägt, bleibt er plötzlich stehen und stellt die Stühle ab. Er sagt, dass ihm nicht gut sei, und setzt sich auf einen Stuhl. Auf Nachfrage beschreibt er ein starkes Druck- und Engegefühl in der Mitte des Brustkorbs. Die Beschwerden ziehen in seinen linken Arm und bis in den Unterkiefer. Der Lehrer ist auffallend blass, auf seiner Stirn steht kalter Schweiß und er wirkt sehr unruhig. Er versucht die Situation herunterzuspielen und erklärt, er habe wahrscheinlich nur etwas Falsches gegessen. Nach einigen Minuten sind die Beschwerden unverändert stark. Im Gebäude befinden sich nur noch wenige Mitarbeiter, und der Haupteingang wurde bereits abgeschlossen."
      },
      {
        typ: "schlaganfall",

        situation:
          "Eine 47-jährige Schulsekretärin spricht am Vormittag mit einer Lehrerin über eine Krankmeldung. Während des Gesprächs fällt der Lehrerin auf, dass die Sekretärin plötzlich undeutlich spricht und einfache Wörter nicht mehr richtig aussprechen kann. Als sie lächeln soll, bewegt sich ein Mundwinkel deutlich weniger als der andere. Die Sekretärin versucht anschließend, mit der rechten Hand eine Tasse anzuheben, kann sie jedoch nicht sicher festhalten. Die Tasse fällt auf den Schreibtisch. Die Frau wirkt verwirrt und versteht zunächst nicht, weshalb die Lehrerin Hilfe holen möchte. Sie erklärt, sie wolle nur kurz nach Hause fahren und sich hinlegen. Wann die Beschwerden genau begonnen haben, ist zunächst unklar. Vor dem Sekretariat warten mehrere Eltern und Kinder."
      },
      {
        typ: "allergie",

        situation:
          "Ein 43-jähriger Hausmeister arbeitet während der Unterrichtszeit auf dem Außengelände der Grundschule. Beim Leeren eines Abfallbehälters wird er von einer Wespe in den Unterarm gestochen. Zunächst klagt er nur über Schmerzen an der Einstichstelle. Wenige Minuten später bemerkt eine Kollegin, dass sich an seinem Hals und auf seinen Armen großflächige, stark juckende Quaddeln bilden. Sein Gesicht und seine Lippen schwellen sichtbar an. Der Hausmeister berichtet über Übelkeit, Schwindel und ein zunehmendes Engegefühl im Hals. Seine Atmung wird angestrengt und er kann nur noch kurze Sätze sprechen. Er wirkt blass und muss sich auf den Boden setzen, weil seine Beine ihn kaum noch tragen. In seiner Arbeitstasche soll sich wegen einer bekannten Allergie ein Notfallset befinden. Wo die Tasche abgestellt wurde, weiß jedoch niemand genau."
      }
    ];

    const kinderfaelle = [
      {
        typ: "allergie",

        situation:
          "In einer ersten Klasse wird der Geburtstag eines Kindes gefeiert. Auf dem Tisch stehen verschiedene selbst gebackene Kuchen und kleine Süßigkeiten. Der siebenjährige Noah nimmt ein Stück Gebäck, dessen Zutaten nicht vollständig bekannt sind. Wenige Minuten nach dem Essen klagt er über ein Kribbeln im Mund und starken Juckreiz an den Händen. Auf seiner Haut entstehen zunehmend rote, erhabene Flecken. Seine Lippen und Augenlider schwellen sichtbar an. Noah sagt, dass sich sein Hals eng anfühle und er schlechter Luft bekomme. Kurz darauf wird er auffallend blass, wirkt kraftlos und muss sich hinsetzen. Der Klassenlehrer erinnert sich, dass bei Noah eine schwere Nahrungsmittelallergie bekannt ist. Im Schulsekretariat soll ein ärztlich verordnetes Notfallset hinterlegt sein. Das Sekretariat befindet sich jedoch in einem anderen Gebäudeteil."
      },
      {
        typ: "schlaganfall",

        situation:
          "Während der Nachmittagsbetreuung sitzt die neunjährige Amelie mit anderen Kindern an einem Basteltisch. Eine Betreuungskraft bemerkt, dass dem Mädchen plötzlich die Schere aus der rechten Hand fällt. Als Amelie sie wieder aufheben möchte, kann sie den rechten Arm nicht richtig bewegen. Auf eine Frage antwortet sie mit undeutlichen und teilweise unverständlichen Worten. Ein Mundwinkel hängt sichtbar herab. Amelie wirkt verängstigt und sagt, dass sie plötzlich starke Kopfschmerzen habe. Beim Versuch aufzustehen schwankt sie und muss sich wieder hinsetzen. Die Betreuungskraft weiß, dass das Mädchen wegen einer angeborenen Herzerkrankung regelmäßig medizinisch untersucht wird. Ob diese Erkrankung mit dem aktuellen Zustand zusammenhängt, ist nicht bekannt. Die Beschwerden sind vor wenigen Minuten plötzlich aufgetreten."
      },
      {
        typ: "kollaps",

        situation:
          "In der Aula einer Grundschule findet am Vormittag eine Probe für die Einschulungsfeier statt. Die achtjährige Lea steht mit ihrer Klasse bereits seit längerer Zeit auf einer engen und warmen Bühne. Sie hat am Morgen kaum gefrühstückt und berichtet einer Freundin, dass ihr schwindelig sei. Kurz darauf wird sie auffallend blass und beginnt zu schwanken. Bevor eine Lehrerin sie erreicht, sackt Lea langsam zu Boden. Für einige Sekunden reagiert sie nicht auf Ansprache. Als die Lehrerin bei ihr ist, öffnet Lea wieder die Augen und antwortet leise. Sie atmet selbstständig, wirkt aber weiterhin schwach und blass. Lea möchte sofort wieder aufstehen, weil sie die Probe nicht verpassen will. Zahlreiche andere Kinder stehen dicht gedrängt um sie herum."
      },
      {
        typ: "fluessigkeitsmangel",

        situation:
          "Ein fünfjähriger Junge ist nach einem Magen-Darm-Infekt erstmals wieder in der Kita. Am Vormittag beteiligt er sich zunächst am Spielen, wirkt aber ruhiger als sonst. Beim Mittagessen möchte er weder essen noch trinken. Eine Erzieherin bemerkt, dass seine Lippen trocken sind und er ungewöhnlich müde wirkt. Als die Gruppe später nach draußen gehen möchte, kann der Junge kaum noch selbstständig aufstehen. Er ist sehr blass, seine Hände fühlen sich kühl an und er reagiert nur verzögert auf Fragen. Die Erzieherin erfährt bei einem Telefonat mit den Eltern, dass das Kind am Vortag mehrfach erbrochen und Durchfall gehabt habe. Wie viel es seitdem getrunken hat, ist unklar. Sein Zustand verschlechtert sich innerhalb kurzer Zeit weiter."
      },
      {
        typ: "hitze",

        situation:
          "An einem sehr warmen Sommertag findet auf dem Sportplatz der Grundschule ein Spielefest statt. Der siebenjährige Paul nimmt nacheinander an mehreren Laufspielen teil. Obwohl er bereits über Kopfschmerzen geklagt hat, möchte er weiter mitmachen. Eine Lehrerin bemerkt später, dass Paul unsicher geht und auf Fragen ungewöhnlich gereizt reagiert. Sein Kopf ist hochrot, seine Haut fühlt sich auffallend heiß und trocken an. Er klagt über Übelkeit und starke Kopfschmerzen. Kurz darauf setzt er sich auf den Boden, wirkt zunehmend verwirrt und weiß nicht mehr, an welcher Station seine Klasse gerade teilnehmen soll. Auf dem Sportplatz gibt es nur wenig Schatten. Die Trinkflasche des Kindes ist nahezu unberührt."
      }
    ];

    const zusatzaufgaben = [
      {
        passendZu:
          [
            "allergie"
          ],

        frage:
          "Wie müssen ärztlich verordnete Notfallmedikamente bei bekannten schweren Allergien aufbewahrt und organisatorisch eingebunden werden, damit sie geschützt, eindeutig zugeordnet und im Notfall schnell verfügbar sind?",

        anpassung:
          "Wählt ein konkretes Kind oder einen realistisch vorstellbaren Fall aus eurer eigenen Kita, Grundschule oder Betreuungseinrichtung. Beschreibt den Aufbewahrungsort des Notfallsets, die Zugänglichkeit während des normalen Betriebs und bei Ausflügen sowie die erforderlichen ärztlichen Anweisungen und Absprachen. Prüft, ob alle zuständigen Mitarbeiter, Vertretungskräfte und neuen Kollegen die Regelung kennen."
      },
      {
        passendZu:
          [
            "herzinfarkt",
            "schlaganfall",
            "allergie",
            "kollaps",
            "fluessigkeitsmangel",
            "hitze"
          ],

        frage:
          "Welche Aufgaben können weitere Mitarbeiter übernehmen, während ein Ersthelfer eine Person mit einem schweren Kreislaufnotfall versorgt? Berücksichtigt insbesondere Notruf, Einweisung des Rettungsdienstes, Betreuung der übrigen Kinder und Freihalten des Notfallbereichs.",

        anpassung:
          "Wählt einen konkreten Ort in eurer eigenen Einrichtung, an dem ein schwerer Kreislaufnotfall auftreten könnte. Beschreibt, welcher Mitarbeiter die betroffene Person versorgen, den Notruf absetzen, den Rettungsdienst einweisen und die übrigen Kinder betreuen würde. Prüft, welche Schwierigkeiten außerhalb der üblichen Betriebszeiten oder bei geringer Personalbesetzung entstehen könnten."
      },
      {
        passendZu:
          [
            "herzinfarkt",
            "schlaganfall",
            "allergie",
            "kollaps",
            "fluessigkeitsmangel",
            "hitze"
          ],

        frage:
          "Wie muss die Alarmierung in einer Kita oder Grundschule organisiert sein, damit Ersthelfer und Rettungsdienst auch in abgelegenen oder schwer zugänglichen Bereichen schnell erreicht beziehungsweise eingewiesen werden können?",

        anpassung:
          "Wählt einen konkreten, möglichst abgelegenen oder schwer zugänglichen Bereich eurer eigenen Einrichtung, beispielsweise das Außengelände, den Sportplatz, die Aula oder einen Nebenraum. Beschreibt den tatsächlichen Ablauf vom Erkennen des Notfalls über die interne Alarmierung und den Notruf bis zur Einweisung des Rettungsdienstes. Benennt mögliche Verzögerungen und Verbesserungsmöglichkeiten."
      },
      {
        passendZu:
          [
            "schlaganfall",
            "allergie"
          ],

        frage:
          "Welche organisatorischen Absprachen sind erforderlich, wenn bei einem Kind oder einem Mitarbeiter eine Erkrankung bekannt ist, die zu einem schweren Kreislaufnotfall führen kann? Wer muss welche Informationen kennen und wie wird das Vorgehen festgelegt?",

        anpassung:
          "Übertragt die Aufgabe auf eine konkrete oder realistisch vorstellbare Person aus eurer eigenen Einrichtung. Beschreibt, welche Informationen, Notfallpläne oder ärztlichen Anweisungen vorliegen müssten und welche Mitarbeiter davon Kenntnis benötigen. Berücksichtigt auch Vertretungskräfte, neue Kollegen, Ausflüge und Veranstaltungen außerhalb des normalen Betriebs."
      },
      {
        passendZu:
          [
            "kollaps",
            "fluessigkeitsmangel",
            "hitze"
          ],

        frage:
          "Wie können Veranstaltungen, Ausflüge und Aktivitäten bei warmem Wetter so organisiert werden, dass Flüssigkeitsmangel, Überhitzung und Kreislaufprobleme möglichst früh erkannt oder vermieden werden?",

        anpassung:
          "Wählt eine konkrete Veranstaltung oder Aktivität aus eurer eigenen Einrichtung, beispielsweise ein Sportfest, einen Ausflug oder einen längeren Aufenthalt auf dem Außengelände. Beschreibt die vorhandenen Trinkmöglichkeiten, Schattenplätze, Pausenregelungen und Zuständigkeiten. Prüft, woran besonders gefährdete Kinder erkannt werden könnten und welche Verbesserungen sinnvoll wären."
      }
    ];

    /*
      Ein weltweit einheitliches Zeitfenster von fünf Stunden.
      Alle Geräte erhalten innerhalb desselben Zeitfensters
      dieselbe Kombination.
    */

    const fuenfStunden =
      5 * 60 * 60 * 1000;

    const zeitfenster =
      Math.floor(Date.now() / fuenfStunden);

    /*
      Deterministische Zufallsfunktion:
      Die Auswahl bleibt innerhalb eines Zeitfensters stabil.
    */

    function pseudoZufall(seed) {
      let wert = seed >>> 0;

      wert ^= wert << 13;
      wert ^= wert >>> 17;
      wert ^= wert << 5;

      return wert >>> 0;
    }

    /*
      Auswahl eines Erwachsenenfalls und eines Kinderfalls.
    */

    const erwachsenenIndex =
      pseudoZufall(zeitfenster + 0x31a7c5) %
      erwachsenenfaelle.length;

    const kinderIndex =
      pseudoZufall(zeitfenster + 0x82d4e9) %
      kinderfaelle.length;

    const erwachsenenFall =
      erwachsenenfaelle[erwachsenenIndex];

    const kinderFall =
      kinderfaelle[kinderIndex];

    /*
      Auch die Reihenfolge wird zufällig festgelegt.
    */

    const reihenfolgeWechseln =
      pseudoZufall(zeitfenster + 0x4f19b3) %
      2 === 1;

    let ersterFall;
    let zweiterFall;

    if (reihenfolgeWechseln) {
      ersterFall = kinderFall;
      zweiterFall = erwachsenenFall;
    } else {
      ersterFall = erwachsenenFall;
      zweiterFall = kinderFall;
    }

    /*
      Eine Zusatzaufgabe gilt als passend, wenn mindestens eine
      der beiden Fallsituationen zu ihrem Themenbereich gehört.

      Allgemeine Organisationsaufgaben passen zu allen Fällen.
    */

    const passendeZusatzaufgaben =
      zusatzaufgaben.filter(function(aufgabe) {
        return (
          aufgabe.passendZu.includes(ersterFall.typ) ||
          aufgabe.passendZu.includes(zweiterFall.typ)
        );
      });

    const zusatzIndex =
      pseudoZufall(zeitfenster + 0xc6e2a7) %
      passendeZusatzaufgaben.length;

    const aktuelleZusatzaufgabe =
      passendeZusatzaufgaben[zusatzIndex];

    /*
      Ausgabe auf der Webseite
    */

    document.getElementById("situation-1").textContent =
      ersterFall.situation;

    document.getElementById("situation-2").textContent =
      zweiterFall.situation;

    document.getElementById("zusatzfrage").textContent =
      aktuelleZusatzaufgabe.frage;

    document.getElementById("anpassungstext").textContent =
      aktuelleZusatzaufgabe.anpassung;
  </script>
</body>
</html>
