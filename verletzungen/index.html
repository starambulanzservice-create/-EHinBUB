<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Teamarbeit zu Verletzungen in Bildungs- und Betreuungseinrichtungen für Kinder"
  >

  <title>Teamarbeit – Verletzungen</title>

  <style>
    :root {
      --star-red: #b00020;
      --text: #222;
      --muted: #5f6670;
      --page: #f2f4f7;
      --card: #ffffff;
      --case: #f7f7f7;
      --extra: #eef3f7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: var(--page);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .karte {
      max-width: 800px;
      margin: 30px auto;
      padding: 30px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .logo {
      margin-bottom: 22px;
      text-align: center;
    }

    .logo img {
      width: min(80%, 280px);
      height: auto;
    }

    h1 {
      margin: 0 0 10px;
      color: var(--star-red);
      text-align: center;
      line-height: 1.25;
    }

    .untertitel {
      margin: 0 0 28px;
      color: var(--muted);
      text-align: center;
    }

    .bereich {
      margin-top: 24px;
      padding: 22px;
      border-radius: 10px;
      line-height: 1.65;
    }

    .fall {
      background: var(--case);
    }

    .zusatz {
      background: var(--extra);
    }

    h2,
    h3 {
      margin: 0 0 12px;
    }

    #situation-1,
    #situation-2,
    #zusatzfrage,
    #anpassungsaufgabe {
      margin: 0;
    }

    #anpassungsaufgabe {
      margin-top: 18px;
    }

    .anpassungs-ueberschrift {
      display: inline-block;
      margin-bottom: 5px;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .karte {
        margin: 10px auto;
        padding: 20px;
      }

      h1 {
        font-size: 1.65rem;
      }

      .bereich {
        padding: 18px;
      }
    }
  </style>
</head>

<body>
  <main class="karte">

    <div class="logo">
      <img
        src="https://image.jimcdn.com/app/cms/image/transf/none/path/s4ae4e01473ee480d/image/i451db4a87a702f00/version/1762536248/image.jpg"
        alt="STAR Ambulanz Service"
      >
    </div>

    <h1>Teamarbeit „Verletzungen“</h1>

    <p class="untertitel">
      Erste Hilfe in Bildungs- und Betreuungseinrichtungen für Kinder
    </p>

    <section class="bereich fall" aria-labelledby="fall-titel-1">
      <h2 id="fall-titel-1">Fallsituation 1</h2>
      <p id="situation-1"></p>
    </section>

    <section class="bereich fall" aria-labelledby="fall-titel-2">
      <h2 id="fall-titel-2">Fallsituation 2</h2>
      <p id="situation-2"></p>
    </section>

    <section class="bereich zusatz" aria-labelledby="zusatz-titel">

      <h3 id="zusatz-titel">
        Zusatzaufgabe – Organisation der Ersten Hilfe
      </h3>

      <p id="zusatzfrage"></p>

      <p id="anpassungsaufgabe">
        <strong class="anpassungs-ueberschrift">
          Anpassung an eure Verhältnisse:
        </strong>
        <br>
        <span id="anpassungstext"></span>
      </p>

    </section>

  </main>

  <script>
    /*
      Die Fallsituationen orientieren sich an den Themen des
      DGUV-Handbuchs zur Ersten Hilfe in Bildungs- und
      Betreuungseinrichtungen für Kinder.

      Es wird jeweils eine Fallsituation mit einem Kind und
      eine Fallsituation mit einem Erwachsenen ausgewählt.
    */

    const kinderfaelle = [
      {
        typ: "knochenbruch",

        situation:
          "Die Kinder einer Kitagruppe spielen am Vormittag auf dem Außengelände. Die fünfjährige Emma klettert auf ein ungefähr zwei Meter hohes Klettergerüst. Als sie nach einer Stange greifen möchte, rutscht sie ab und fällt auf den Boden. Eine Erzieherin findet sie seitlich neben dem Gerüst liegend. Emma ist wach, weint laut und klagt über starke Schmerzen im rechten Arm. Sie hält den Arm dicht am Körper und möchte weder aufstehen noch ihre Lage verändern. Der Arm ist mit einer dicken Jacke bekleidet. Bereits der Versuch, den Ärmel vorsichtig anzuheben, verursacht starke Schmerzen. Eine offene Wunde oder Blutung ist zunächst nicht zu erkennen. Mehrere Kinder stehen unmittelbar daneben und möchten wissen, was passiert ist. Die zweite Erzieherin befindet sich mit einem Teil der Gruppe in einem anderen Bereich des Außengeländes."
      },
      {
        typ: "kopfverletzung",

        situation:
          "Während der großen Pause spielen mehrere Grundschulkinder Fußball. Der achtjährige Lukas läuft einem Ball hinterher und stößt dabei mit dem Kopf gegen einen Metallpfosten. Er fällt zu Boden, steht aber nach kurzer Zeit selbstständig wieder auf. An seiner Stirn befindet sich eine deutlich blutende Platzwunde. Lukas sagt zunächst, es gehe ihm gut und er wolle weiterspielen. Wenige Minuten später klagt er jedoch über zunehmende Kopfschmerzen, Schwindel und Übelkeit. Er kann sich nicht genau daran erinnern, wie er gegen den Pfosten gelaufen ist, und fragt wiederholt, was passiert sei. Die Aufsichtsperson bemerkt, dass Lukas zunehmend müde wirkt und sich hinlegen möchte. Gleichzeitig muss sie die übrigen Kinder auf dem weitläufigen Schulhof beaufsichtigen."
      },
      {
        typ: "starke_blutung",

        situation:
          "Auf dem Schulhof findet ein Projekttag statt. Der neunjährige David hilft dabei, leichte Dekorationen an einem niedrigen Metallzaun zu befestigen. Beim Zurücktreten bleibt er an einer beschädigten, scharfkantigen Stelle hängen und zieht sich eine mehrere Zentimeter lange Wunde am Unterschenkel zu. Das Blut läuft deutlich aus der Wunde und durchtränkt innerhalb kurzer Zeit seine Socke. David ist wach, aber sehr erschrocken. Er beginnt zu zittern, wird auffallend blass und sagt, dass ihm schwindelig sei. Mehrere Mitschüler reagieren auf das sichtbare Blut panisch. Eine Lehrerin bringt einen Verbandkasten, stellt aber fest, dass bereits mehrere Materialien daraus entnommen wurden und sie nicht sofort erkennen kann, ob noch ausreichend Material für die Versorgung vorhanden ist."
      },
      {
        typ: "fremdkoerper_auge",

        situation:
          "Eine Gruppe von Grundschulkindern arbeitet im Werkraum mit Holz. Obwohl die Kinder angewiesen wurden, Schutzbrillen zu tragen, nimmt die siebenjährige Sophie ihre Brille kurz ab, weil sie beschlagen ist. In diesem Moment wird am Nachbartisch ein Holzstück abgeschliffen. Sophie schreit auf und hält sich sofort die Hand vor das rechte Auge. Das Auge tränt stark und ist gerötet. Sie klagt über einen brennenden Schmerz und das Gefühl, dass etwas im Auge stecke. Sophie kneift das Auge fest zu und versucht wiederholt, daran zu reiben. Die Lehrerin kann nicht erkennen, ob sich ein kleiner Holzsplitter oder nur Staub im Auge befindet. Die übrigen Kinder arbeiten noch an ihren Werkstücken, und mehrere elektrische Geräte sind weiterhin eingeschaltet."
      },
      {
        typ: "bisswunde",

        situation:
          "Eine Kindergartengruppe besucht im Rahmen eines Ausflugs einen kleinen Bauernhof. Der sechsjährige Max möchte einen dort frei laufenden Hund streicheln. Als er sich über das Tier beugt, schnappt der Hund plötzlich nach seiner Hand. Max zieht die Hand zurück und beginnt laut zu weinen. Auf dem Handrücken sind mehrere Bissstellen zu erkennen. Eine Stelle blutet deutlich, das umliegende Gewebe ist gerötet und beginnt anzuschwellen. Die Erzieherin weiß nicht, ob der Hund regelmäßig tierärztlich untersucht oder geimpft wurde. Der Besitzer des Hofes ist im Moment nicht auffindbar. Die Gruppe befindet sich mehrere Kilometer von der Einrichtung entfernt. Eine weitere Betreuungskraft muss gleichzeitig die übrigen Kinder zusammenhalten und beruhigen."
      }
    ];

    const erwachsenenfaelle = [
      {
        typ: "starke_blutung",

        situation:
          "Eine 36-jährige Mitarbeiterin bereitet in der Küche einer Betreuungseinrichtung Obst für das gemeinsame Frühstück vor. Beim Schneiden rutscht das Messer ab und verursacht eine tiefe, mehrere Zentimeter lange Wunde an ihrer linken Handfläche. Die Wunde beginnt sofort stark zu bluten. Blut läuft über ihre Finger und tropft auf den Boden. Die Mitarbeiterin ist wach und ansprechbar, wirkt aber deutlich erschrocken und hält die verletzte Hand instinktiv hoch. Bewegungen der Finger sind sehr schmerzhaft. Zwei Kinder befinden sich bereits in der Küchenzeile und beobachten das Geschehen. Eine Kollegin holt den Verbandkasten, während eine weitere Mitarbeiterin versucht, die übrige Kindergruppe aus dem Bereich zu begleiten."
      },
      {
        typ: "fremdkoerper_wunde",

        situation:
          "Eine 31-jährige Erzieherin bringt am Nachmittag gemeinsam mit einer Kollegin Dekorationen im Gruppenraum an. Beim Arbeiten auf einer kleinen Trittleiter verliert sie das Gleichgewicht. Sie versucht, sich an einem Tisch abzustützen, auf dem eine geöffnete Schere liegt. Dabei dringt die Schere in ihre rechte Handfläche ein und bleibt dort stecken. Die Erzieherin klagt über starke Schmerzen. Um die Schere herum ist eine mittelstarke Blutung zu erkennen. Sie ist sehr aufgeregt und möchte den Gegenstand sofort selbst herausziehen. Mehrere Kinder befinden sich im Raum und kommen neugierig näher. Die zweite Erzieherin ist unsicher, ob sie die Schere entfernen oder die verletzte Kollegin zunächst in einen anderen Raum begleiten soll."
      },
      {
        typ: "verbruehung",

        situation:
          "Eine 45-jährige Mitarbeiterin bereitet in der Teeküche einer Grundschule heiße Getränke für eine Besprechung vor. Als sie den Wasserkocher anhebt, löst sich der Deckel. Sehr heißes Wasser läuft über beide Unterarme und einen Teil ihres Bauches und Oberschenkels. Die Mitarbeiterin schreit auf und lässt den Wasserkocher fallen. Ihre Kleidung ist im Bauch- und Oberschenkelbereich mit heißem Wasser durchnässt. Die betroffenen Hautstellen sind stark gerötet und sehr schmerzhaft. An einzelnen Bereichen beginnen sich Blasen zu bilden. Die Mitarbeiterin versucht hektisch, ihre Kleidung auszuziehen. Im angrenzenden Raum warten mehrere Kinder auf den Beginn einer Arbeitsgemeinschaft. Eine Kollegin weiß nicht, ob sie die betroffenen Bereiche großflächig und über längere Zeit mit kaltem Wasser kühlen soll."
      },
      {
        typ: "gelenkverletzung",

        situation:
          "Ein 52-jähriger Lehrer trägt mehrere Bücher eine Treppe hinunter. Auf einer Stufe knickt er mit dem rechten Fuß um und stürzt auf das Treppenpodest. Er ist wach und ansprechbar und kann selbstständig sitzen. Sein rechtes Sprunggelenk schwillt innerhalb kurzer Zeit deutlich an. Der Lehrer klagt über starke Schmerzen und kann den Fuß nicht mehr belasten. Eine offene Wunde ist nicht zu erkennen. Er möchte sich am Geländer hochziehen und auf einem Bein bis zum Lehrerzimmer gehen. Mehrere Grundschulkinder kommen gerade die Treppe herunter und müssen an der Unfallstelle vorbeigeführt werden. Der nächste Verbandkasten befindet sich im Schulsekretariat in einem anderen Gebäudeteil."
      }
    ];

    const zusatzaufgaben = [
      {
        passendZu: [
          "knochenbruch",
          "kopfverletzung",
          "starke_blutung",
          "fremdkoerper_auge",
          "bisswunde",
          "fremdkoerper_wunde",
          "verbruehung",
          "gelenkverletzung"
        ],

        frage:
          "Wie muss sichergestellt werden, dass geeignetes und vollständiges Erste-Hilfe-Material in allen relevanten Bereichen einer Kita oder Grundschule schnell verfügbar ist? Berücksichtigt dabei auch Außengelände, Werkraum, Sportbereiche und Ausflüge.",

        anpassung:
          "Wählt einen konkreten Bereich oder eine konkrete Veranstaltung aus eurer eigenen Einrichtung. Beschreibt, wo sich das benötigte Erste-Hilfe-Material befindet, wie schnell es erreichbar ist, wer es regelmäßig auf Vollständigkeit und Haltbarkeit prüft und wie verbrauchtes Material ersetzt wird. Benennt mögliche organisatorische Lücken."
      },
      {
        passendZu: [
          "knochenbruch",
          "kopfverletzung",
          "starke_blutung",
          "fremdkoerper_auge",
          "bisswunde",
          "fremdkoerper_wunde",
          "verbruehung",
          "gelenkverletzung"
        ],

        frage:
          "Was muss nach einer Verletzung hinsichtlich Information der Erziehungsberechtigten, Dokumentation der Erste-Hilfe-Leistung, möglicher Unfallanzeige und ärztlicher Abklärung organisatorisch geregelt sein?",

        anpassung:
          "Übertragt die Aufgabe auf eine konkrete Verletzung aus eurer eigenen Kita, Grundschule oder Betreuungseinrichtung. Beschreibt, wer die Erziehungsberechtigten informiert, wo die Erste-Hilfe-Leistung dokumentiert wird und wie entschieden wird, ob eine ärztliche Behandlung erforderlich ist. Prüft, ob die Abläufe und Zuständigkeiten allen Mitarbeitern bekannt sind."
      },
      {
        passendZu: [
          "knochenbruch",
          "kopfverletzung",
          "starke_blutung",
          "fremdkoerper_auge",
          "bisswunde",
          "fremdkoerper_wunde",
          "verbruehung",
          "gelenkverletzung"
        ],

        frage:
          "Welche Aufgaben können weitere Mitarbeiter übernehmen, während ein Ersthelfer die verletzte Person versorgt? Berücksichtigt insbesondere Notruf, Einweisung des Rettungsdienstes, Betreuung der übrigen Kinder, Absicherung des Unfallortes und Bereitstellung von Erste-Hilfe-Material.",

        anpassung:
          "Wählt einen konkreten Unfallort in eurer eigenen Einrichtung. Beschreibt, welcher Mitarbeiter die verletzte Person versorgen, Hilfe und Material holen, den Rettungsdienst einweisen, den Unfallort absichern und die übrigen Kinder betreuen würde. Prüft, welche Schwierigkeiten bei geringer Personalbesetzung entstehen könnten."
      },
      {
        passendZu: [
          "knochenbruch",
          "kopfverletzung",
          "fremdkoerper_auge",
          "bisswunde",
          "fremdkoerper_wunde",
          "verbruehung",
          "gelenkverletzung"
        ],

        frage:
          "Welche Möglichkeiten hat der Ersthelfer zur Schmerzbekämpfung, ohne selbst Medikamente zu verabreichen? Berücksichtigt geeignete Kühlung, eine möglichst schmerzarme Lagerung beziehungsweise Ruhigstellung und die psychologische Betreuung.",

        anpassung:
          "Wählt eine konkrete Verletzung, die in eurer eigenen Einrichtung auftreten könnte. Beschreibt, welche Form der Kühlung, Lagerung oder Ruhigstellung praktisch möglich wäre und mit welchen Worten oder Handlungen ihr die betroffene Person beruhigen würdet. Prüft auch, welche dafür benötigten Materialien tatsächlich vorhanden sind."
      },
      {
        passendZu: [
          "knochenbruch",
          "kopfverletzung",
          "starke_blutung",
          "fremdkoerper_auge",
          "bisswunde",
          "fremdkoerper_wunde",
          "verbruehung",
          "gelenkverletzung"
        ],

        frage:
          "Welche Bedeutung hat die Gefährdungsbeurteilung für die Vermeidung typischer Verletzungen in Bildungs- und Betreuungseinrichtungen? Welche technischen, organisatorischen oder personenbezogenen Schutzmaßnahmen kommen infrage?",

        anpassung:
          "Wählt einen konkreten Unfallort oder Arbeitsablauf aus eurer eigenen Einrichtung, beispielsweise ein Klettergerüst, eine Treppe, einen Werkraum, eine Küche oder einen Ausflug. Beschreibt die vorhandenen Gefahren und entwickelt konkrete Maßnahmen, mit denen ein vergleichbarer Unfall verhindert oder seine Folgen vermindert werden könnten."
      }
    ];

    /*
      Ein weltweit einheitliches Zeitfenster von fünf Stunden.
      Alle Geräte erhalten innerhalb desselben Zeitfensters
      dieselbe Kombination.
    */

    const fuenfStunden =
      5 * 60 * 60 * 1000;

    const zeitfenster =
      Math.floor(Date.now() / fuenfStunden);

    /*
      Deterministische Zufallsfunktion:
      Die Auswahl bleibt innerhalb eines Zeitfensters stabil.
    */

    function pseudoZufall(seed) {
      let wert = seed >>> 0;

      wert ^= wert << 13;
      wert ^= wert >>> 17;
      wert ^= wert << 5;

      return wert >>> 0;
    }

    /*
      Auswahl eines Kinderfalls und eines Erwachsenenfalls.
    */

    const kinderIndex =
      pseudoZufall(zeitfenster + 0x74c2e1) %
      kinderfaelle.length;

    const erwachsenenIndex =
      pseudoZufall(zeitfenster + 0xb93f65) %
      erwachsenenfaelle.length;

    const kinderFall =
      kinderfaelle[kinderIndex];

    const erwachsenenFall =
      erwachsenenfaelle[erwachsenenIndex];

    /*
      Auch die Reihenfolge der beiden Fälle wird gewechselt.
    */

    const reihenfolgeWechseln =
      pseudoZufall(zeitfenster + 0x38a7d4) %
      2 === 1;

    let ersterFall;
    let zweiterFall;

    if (reihenfolgeWechseln) {
      ersterFall = kinderFall;
      zweiterFall = erwachsenenFall;
    } else {
      ersterFall = erwachsenenFall;
      zweiterFall = kinderFall;
    }

    /*
      Die Zusatzaufgabe wird aus den Aufgaben ausgewählt,
      die zu mindestens einer der beiden Verletzungen passen.
    */

    const passendeZusatzaufgaben =
      zusatzaufgaben.filter(function(aufgabe) {
        return (
          aufgabe.passendZu.includes(ersterFall.typ) ||
          aufgabe.passendZu.includes(zweiterFall.typ)
        );
      });

    const zusatzIndex =
      pseudoZufall(zeitfenster + 0xd17b49) %
      passendeZusatzaufgaben.length;

    const aktuelleZusatzaufgabe =
      passendeZusatzaufgaben[zusatzIndex];

    /*
      Ausgabe auf der Webseite
    */

    document.getElementById("situation-1").textContent =
      ersterFall.situation;

    document.getElementById("situation-2").textContent =
      zweiterFall.situation;

    document.getElementById("zusatzfrage").textContent =
      aktuelleZusatzaufgabe.frage;

    document.getElementById("anpassungstext").textContent =
      aktuelleZusatzaufgabe.anpassung;
  </script>
</body>
</html>
