<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Gruppenarbeit zu Atemstörungen in Bildungs- und Betreuungseinrichtungen für Kinder"
  >

  <title>Teamarbeit – Störungen der Atmung</title>

  <style>
    :root {
      --star-red: #b00020;
      --text: #222;
      --muted: #5f6670;
      --page: #f2f4f7;
      --card: #ffffff;
      --case: #f7f7f7;
      --extra: #eef3f7;
      --transfer: #ffffff;
      --transfer-line: #b7c6d4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: var(--page);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .karte {
      max-width: 800px;
      margin: 30px auto;
      padding: 30px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .logo {
      margin-bottom: 22px;
      text-align: center;
    }

    .logo img {
      width: min(80%, 280px);
      height: auto;
    }

    h1 {
      margin: 0 0 10px;
      color: var(--star-red);
      text-align: center;
      line-height: 1.25;
    }

    .untertitel {
      margin: 0 0 28px;
      color: var(--muted);
      text-align: center;
    }

    .bereich {
      margin-top: 24px;
      padding: 22px;
      border-radius: 10px;
      line-height: 1.6;
    }

    .fall {
      background: var(--case);
    }

    .zusatz {
      background: var(--extra);
    }

    h2,
    h3 {
      margin: 0 0 12px;
    }

    #situation,
    #zusatzfrage {
      margin: 0;
    }

    .einrichtungstransfer {
      margin-top: 20px;
      padding: 18px;
      background: var(--transfer);
      border-left: 5px solid var(--transfer-line);
      border-radius: 8px;
    }

    .einrichtungstransfer h4 {
      margin: 0 0 8px;
      color: var(--star-red);
    }

    .einrichtungstransfer p {
      margin: 0;
    }

    .hinweis {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
      text-align: center;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .karte {
        margin: 10px auto;
        padding: 20px;
      }

      h1 {
        font-size: 1.65rem;
      }

      .bereich {
        padding: 18px;
      }
    }
  </style>
</head>

<body>
  <main class="karte">

    <div class="logo">
      <img
        src="https://image.jimcdn.com/app/cms/image/transf/none/path/s4ae4e01473ee480d/image/i451db4a87a702f00/version/1762536248/image.jpg"
        alt="STAR Ambulanz Service"
      >
    </div>

    <h1>Teamarbeit „Störungen der Atmung“</h1>

    <p class="untertitel">
      Erste Hilfe in Bildungs- und Betreuungseinrichtungen für Kinder
    </p>

    <section class="bereich fall" aria-labelledby="fall-titel">
      <h2 id="fall-titel">Fallsituation</h2>
      <p id="situation"></p>
    </section>

    <section class="bereich zusatz" aria-labelledby="zusatz-titel">

      <h3 id="zusatz-titel">
        Zusatzaufgabe – Organisation der Ersten Hilfe
      </h3>

      <p id="zusatzfrage"></p>

      <div class="einrichtungstransfer">
        <h4>Verpflichtender Einrichtungstransfer</h4>
        <p id="transferaufgabe"></p>
      </div>

    </section>

    <p class="hinweis">
      Fallsituation und Zusatzaufgabe wechseln automatisch alle fünf Stunden.
    </p>

  </main>

  <script>
    const faelle = [
      {
        situation:
          "Ein fünfjähriges Mädchen hat bei kühlem Wetter auf dem Außengelände Fangen gespielt. Anschließend setzt es sich auf eine Bank und bekommt zunehmend Schwierigkeiten beim Atmen. Das Mädchen stützt seine Arme auf den Oberschenkeln ab und kann nur noch kurze Sätze sprechen. Seine Atmung ist beschleunigt; beim Ausatmen ist ein pfeifendes Geräusch hörbar. Eine Erzieherin weiß, dass das Kind gelegentlich ein ärztlich verordnetes Spray benötigt."
      },
      {
        situation:
          "Ein vierjähriger Junge isst in der Kita ein Stück Rohkost. Plötzlich greift er sich an den Hals, steht hektisch auf und wirkt panisch. Er kann nicht sprechen und trotz sichtbarer Anstrengung nicht wirksam husten. Seine Atmung ist stark behindert und seine Lippen verfärben sich zunehmend bläulich. Nach kurzer Zeit werden seine Bewegungen schwächer."
      },
      {
        situation:
          "Eine 41-jährige Erzieherin beaufsichtigt die Kinder auf dem Außengelände. Nach körperlicher Anstrengung bleibt sie stehen, beugt den Oberkörper nach vorn und stützt die Hände auf den Knien ab. Sie kann nur noch einzelne Worte sprechen. Beim Ausatmen ist ein deutliches Pfeifen zu hören. Die Erzieherin zeigt auf ihre Jackentasche und erklärt mit Mühe, dass sich dort ihr ärztlich verordnetes Notfallspray befindet."
      },
      {
        situation:
          "Ein 56-jähriger Lehrer unterhält sich während der Pause beim Essen mit Kollegen. Plötzlich verstummt er, greift sich an den Hals und steht vom Tisch auf. Er kann eine Frage nicht beantworten und hustet nur noch schwach und geräuschlos. Sein Gesicht wirkt zunehmend bläulich und er verliert sichtbar an Kraft."
      },
      {
        situation:
          "Ein dreijähriges Kind hatte am Morgen bereits Schnupfen und eine heisere Stimme. Während der Ruhezeit wacht es plötzlich auf, hustet auffallend bellend und atmet deutlich angestrengt. Besonders beim Einatmen ist ein raues, ziehendes Geräusch hörbar. Das Kind ist sehr ängstlich, weint und möchte auf den Arm genommen werden. Durch die Aufregung scheint sich die Atemnot zu verstärken."
      },
      {
        situation:
          "Ein sechsjähriges Mädchen trinkt während eines Sommerfestes im Schulgarten aus einer geöffneten Saftflasche. Plötzlich schreit es auf und zeigt in seinen Mund. Es klagt über starke Schmerzen im Hals und Schwierigkeiten beim Schlucken. Kurz darauf nimmt die Schwellung im Mund- und Rachenraum sichtbar zu. Das Kind wird panisch und bekommt zunehmend schlechter Luft. Ob eine Allergie bekannt ist, wissen die anwesenden Mitarbeiter nicht."
      },
      {
        situation:
          "Ein 38-jähriger Erzieher trinkt während einer Pause im Außengelände aus einer geöffneten Getränkedose. Unmittelbar danach verspürt er einen starken Stich und Schmerzen im Mund- und Rachenraum. Seine Zunge schwillt sichtbar an, das Schlucken fällt ihm zunehmend schwer und seine Atmung wird angestrengt. Er ist sehr unruhig und kann nur noch kurze Sätze sprechen."
      }
    ];

    const zusatzaufgaben = [
      {
        frage:
          "Wie müssen ärztlich verordnete Notfallmedikamente eines Kindes aufbewahrt und organisatorisch eingebunden werden, damit sie vor dem Zugriff anderer Kinder geschützt, im Notfall aber schnell verfügbar und eindeutig zugeordnet sind?",

        transfer:
          "Wählt ein konkretes Kind oder ein realistisches Beispiel aus eurer eigenen Kita, Grundschule oder Betreuungseinrichtung, bei dem ein Notfallmedikament benötigt werden könnte. Beschreibt den vorgesehenen Aufbewahrungsort, die Zugänglichkeit im Notfall, die eindeutige Zuordnung und die erforderlichen Absprachen. Benennt auch möglichen Verbesserungsbedarf."
      },
      {
        frage:
          "Welche Aufgaben können weitere Mitarbeiter übernehmen, während ein Ersthelfer die betroffene Person versorgt – insbesondere hinsichtlich Notruf, Einweisung des Rettungsdienstes, Betreuung der übrigen Kinder und Information der Erziehungsberechtigten?",

        transfer:
          "Wählt einen konkreten Ort in eurer eigenen Kita, Grundschule oder Betreuungseinrichtung. Beschreibt anhand eines dort auftretenden Atemnotfalls, welche Mitarbeiter welche Aufgaben übernehmen würden. Berücksichtigt dabei auch die Betreuung der übrigen Kinder und benennt mögliche organisatorische Lücken."
      },
      {
        frage:
          "Welche organisatorischen Absprachen sind erforderlich, wenn bei einem Kind eine Atemwegserkrankung oder eine schwere Allergie bekannt ist? Wer muss welche Informationen kennen und wie wird das Vorgehen im Notfall festgelegt?",

        transfer:
          "Übertragt die Aufgabe auf ein konkretes oder realistisch vorstellbares Kind aus eurer eigenen Einrichtung. Beschreibt, welche Informationen vorliegen müssten, welche Mitarbeiter das vereinbarte Vorgehen kennen sollten und wie Vertretungen, neue Kollegen oder Begleitpersonen bei Ausflügen einbezogen werden. Benennt auch möglichen Verbesserungsbedarf."
      },
      {
        frage:
          "Wie muss die Erste Hilfe bei Ausflügen, Wandertagen und Aufenthalten außerhalb des Einrichtungsgeländes organisiert sein? Berücksichtigt Erreichbarkeit, Notrufmöglichkeit, Erste-Hilfe-Material, Notfallmedikamente und die Zahl der anwesenden Ersthelfer.",

        transfer:
          "Wählt einen tatsächlich durchgeführten oder konkret geplanten Ausflug eurer eigenen Kita, Grundschule oder Betreuungseinrichtung. Beschreibt, wie bei einer plötzlich auftretenden schweren Atemstörung gehandelt würde, wer den Notruf absetzt, wie der Rettungsdienst den Aufenthaltsort findet und wie die übrigen Kinder beaufsichtigt werden. Benennt mögliche Verbesserungen."
      },
      {
        frage:
          "Wie muss die Alarmierung in einer Kita oder Grundschule organisiert sein, damit Ersthelfer und Rettungsdienst auch aus abgelegenen Bereichen wie Außengelände, Sporthalle oder Nebenräumen schnell erreicht beziehungsweise eingewiesen werden können?",

        transfer:
          "Wählt einen konkreten, möglichst abgelegenen Bereich eurer eigenen Einrichtung. Beschreibt den tatsächlichen Weg vom Erkennen des Notfalls über die interne Alarmierung und den Notruf bis zur Einweisung des Rettungsdienstes. Prüft, wo Zeit verloren gehen könnte und welche organisatorischen Verbesserungen sinnvoll wären."
      }
    ];

    /*
      Ein weltweit einheitliches Zeitfenster von fünf Stunden.
      Alle Geräte erhalten innerhalb desselben Zeitfensters
      dieselbe Fallsituation und dieselbe Zusatzaufgabe.
    */

    const fuenfStunden =
      5 * 60 * 60 * 1000;

    const zeitfenster =
      Math.floor(Date.now() / fuenfStunden);

    /*
      Deterministische Zufallsfunktion:
      Die Auswahl bleibt innerhalb des Zeitfensters stabil.
    */

    function pseudoZufall(seed) {
      let wert = seed >>> 0;

      wert ^= wert << 13;
      wert ^= wert >>> 17;
      wert ^= wert << 5;

      return wert >>> 0;
    }

    /*
      Fallsituation und Zusatzaufgabe werden unabhängig
      voneinander ausgewählt.
    */

    const fallIndex =
      pseudoZufall(zeitfenster + 0x51f15e) %
      faelle.length;

    const zusatzIndex =
      pseudoZufall(zeitfenster + 0xa7d3c9) %
      zusatzaufgaben.length;

    const aktuellerFall =
      faelle[fallIndex];

    const aktuelleZusatzaufgabe =
      zusatzaufgaben[zusatzIndex];

    /*
      Ausgabe auf der Webseite
    */

    document.getElementById("situation").textContent =
      aktuellerFall.situation;

    document.getElementById("zusatzfrage").textContent =
      aktuelleZusatzaufgabe.frage;

    document.getElementById("transferaufgabe").textContent =
      aktuelleZusatzaufgabe.transfer;
  </script>
</body>
</html>
